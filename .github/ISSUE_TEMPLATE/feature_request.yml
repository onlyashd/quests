name: Feature request
description: Suggest a new feature or an improvement.
title: "feat: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea! FERA Quests is built so that the server learns as little as
        possible about participants. Proposals that keep it that way are much easier to accept.

  - type: dropdown
    id: target
    attributes:
      label: Which part would it change?
      multiple: true
      options:
        - Android app
        - iOS app
        - Server
        - Redeemer (points counter)
        - Protocol
        - Not sure
    validations:
      required: true

  - type: dropdown
    id: role
    attributes:
      label: Who is it for?
      multiple: true
      options:
        - Participants
        - Leaders
        - Admins
        - Developers / operators

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
      placeholder: As a leader, I can't ... so I have to ...
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How should it work? Mockups and examples are welcome.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other ways to solve it, including workarounds you use today.

  - type: textarea
    id: privacy
    attributes:
      label: Privacy impact
      description: >-
        Would the server, a leader or other participants learn anything new? For example who
        took part, when, from where, or which quests belong to the same person. Write "none"
        if it changes nothing.
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched the existing issues and this hasn't been proposed.
          required: true
        - label: I'd like to help implement it.
