# FERA Quests :server configuration (backend.md §10).
# Every value can be overridden with the environment variable shown next to it.

quests {
  http {
    # Outer port: only /ohttp and /ohttp/keys are ever exposed here.
    port = 8080
    port = ${?PORT}
    # Internal port: health and metrics. Never exposed publicly.
    internal_port = 9090
    internal_port = ${?INTERNAL_PORT}
  }

  db {
    url = "jdbc:postgresql://localhost:5432/quests"
    url = ${?DB_URL}
    user = "quests"
    user = ${?DB_USER}
    password = "quests"
    password = ${?DB_PASSWORD}
    max_pool_size = 10
    max_pool_size = ${?DB_MAX_POOL_SIZE}
  }

  s3 {
    endpoint = "http://localhost:9000"
    endpoint = ${?S3_ENDPOINT}
    bucket = "artifacts"
    bucket = ${?S3_BUCKET}
    access_key = "minioadmin"
    access_key = ${?S3_ACCESS_KEY}
    secret_key = "minioadmin"
    secret_key = ${?S3_SECRET_KEY}
  }

  # Envelope key for issuer/OHTTP/config private keys. Required outside dev.
  master_key = ""
  master_key = ${?MASTER_KEY}
  # Comma-separated relay egress CIDRs / mTLS identities. Empty = dev (allow all).
  relay_allowlist = ""
  relay_allowlist = ${?RELAY_ALLOWLIST}
  # Path to the pinned genesis admin set JSON (same file baked into the app).
  genesis_admin_set = ""
  genesis_admin_set = ${?GENESIS_ADMIN_SET}
  issuer_name = "quests.fera"
  issuer_name = ${?ISSUER_NAME}

  # Tunables (decided 2026-11-09), all published in /v1/config.
  tunables {
    tokens_per_epoch = 10
    tokens_per_epoch = ${?TOKENS_PER_EPOCH}
    token_epoch_days = 7
    token_epoch_days = ${?TOKEN_EPOCH_DAYS}
    claim_ttl_days = 7
    claim_ttl_days = ${?CLAIM_TTL_DAYS}
    max_reward_units = 100
    max_reward_units = ${?MAX_REWARD_UNITS}
    max_artifact_bytes = 16777216
    max_artifact_bytes = ${?MAX_ARTIFACT_BYTES}
    voucher_epoch_days = 30
    voucher_epoch_days = ${?VOUCHER_EPOCH_DAYS}
    status_prefix_bits = 12
    status_prefix_bits = ${?STATUS_PREFIX_BITS}
    artifact_retention_days = 7
    artifact_retention_days = ${?ARTIFACT_RETENTION_DAYS}
    unreviewed_retention_days = 60
    unreviewed_retention_days = ${?UNREVIEWED_RETENTION_DAYS}
    terminal_retention_days = 30
    terminal_retention_days = ${?TERMINAL_RETENTION_DAYS}
    transfer_timeout_days = 14
    transfer_timeout_days = ${?TRANSFER_TIMEOUT_DAYS}
  }
}
