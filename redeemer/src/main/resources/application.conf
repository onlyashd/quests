# FERA Quests :redeemer configuration (backend.md §8, §10).

redeemer {
  http {
    port = 8081
    port = ${?PORT}
    internal_port = 9091
    internal_port = ${?INTERNAL_PORT}
  }

  db {
    url = "jdbc:postgresql://localhost:5433/redeemer"
    url = ${?DB_URL}
    user = "redeemer"
    user = ${?DB_USER}
    password = "redeemer"
    password = ${?DB_PASSWORD}
    max_pool_size = 10
    max_pool_size = ${?DB_MAX_POOL_SIZE}
  }

  # Where to fetch the admin-set chain and leader list. Every signature is re-verified
  # here against the pinned genesis set — the redeemer never trusts :server.
  server_url = "http://localhost:8080"
  server_url = ${?SERVER_URL}
  genesis_admin_set = ""
  genesis_admin_set = ${?GENESIS_ADMIN_SET}

  tunables {
    voucher_accept_grace_days = 90
    voucher_accept_grace_days = ${?VOUCHER_ACCEPT_GRACE_DAYS}
    spend_lock_minutes = 10
    spend_lock_minutes = ${?SPEND_LOCK_MINUTES}
    max_vouchers_per_spend = 500
    max_vouchers_per_spend = ${?MAX_VOUCHERS_PER_SPEND}
  }
}
